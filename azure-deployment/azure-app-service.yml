# ── Azure App Service Deployment — GA4 Dashboard ──────────────────────────
# GitHub Actions workflow: push to main → build Docker image → deploy to Azure
#
# Prerequisites:
#   1. Azure App Service (B1, Linux container) created in portal
#   2. Azure Container Registry (ACR) created
#   3. GitHub secrets set:
#      AZURE_CREDENTIALS        → Service principal JSON
#      REGISTRY_LOGIN_SERVER    → e.g. myregistry.azurecr.io
#      REGISTRY_USERNAME        → ACR username
#      REGISTRY_PASSWORD        → ACR password
#      AZURE_WEBAPP_NAME        → Your App Service name

name: Deploy to Azure App Service

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_LOGIN_SERVER }}/ga4-dashboard:${{ github.sha }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.REGISTRY_LOGIN_SERVER }}/ga4-dashboard:${{ github.sha }}
